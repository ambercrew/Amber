syntax = "proto3";

import "google/protobuf/timestamp.proto";

package generated_code;

message DeletedEntity {
  string entity_name = 1;
  google.protobuf.Timestamp deleted_date = 2;
}

// The trash state of a single element. An absent trashed_at means the element
// is not in the trash, either because it never was or because it was restored.
message TrashState {
  google.protobuf.Timestamp trashed_at = 1;
  bool trashed_root = 2;
  google.protobuf.Timestamp trash_modified_at = 3;
}
