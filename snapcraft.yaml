name: amber
base: core24
title: Amber
version: '1.0.0'
license: AGPL-3.0
summary: Distraction-free, minimalist yet powerful incremental learning — free and open source.
description: |
  Distraction-free, minimalist yet powerful incremental learning — free and open source.
website: https://amberapp.dev
issues: https://github.com/ambercrew/amber/issues/new
source-code: https://github.com/ambercrew/amber
donation: https://ko-fi.com/ramikw

grade: stable
confinement: strict

layout:
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/webkit2gtk-4.1:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/webkit2gtk-4.1

apps:
  amber:
    command: usr/bin/Amber
    desktop: "usr/share/applications/Amber.desktop"
    extensions: [gnome]
    plugs:
      - network
      - home
      - removable-media
      - password-manager-service
      - single-instance-plug
    slots:
      - single-instance

slots:
  single-instance:
    interface: dbus
    bus: session
    name: org.dev_amberapp.SingleInstance

plugs:
  single-instance-plug:
    interface: dbus
    bus: session
    name: org.dev_amberapp.SingleInstance


parts:
  build-app:
    plugin: dump
    build-snaps:
      - node/20/stable
      - rustup/latest/stable
    build-packages:
      - libwebkit2gtk-4.1-dev
      - build-essential
      - curl
      - wget
      - file
      - libxdo-dev
      - libssl-dev
      - libayatana-appindicator3-dev
      - librsvg2-dev
      - dpkg
      - unzip
      - protobuf-compiler
      - libprotobuf-dev
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libayatana-appindicator3-1
    source: .
    override-build: |
      # Used for local builds
      if [ -f $SNAPCRAFT_PROJECT_DIR/.build-secrets ]; then
        # Add secrets
        set -a
        source $SNAPCRAFT_PROJECT_DIR/.build-secrets
        set +a
      fi

      # Setup Rust
      rustup default stable

      set -eu
      npm install
      npm run tauri build -- --bundles deb --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --features store
      dpkg -x src-tauri/target/release/bundle/deb/*.deb $SNAPCRAFT_PART_INSTALL/
      sed -i -e "s|Icon=Amber|Icon=/usr/share/icons/hicolor/128x128/apps/Amber.png|g" "$SNAPCRAFT_PART_INSTALL/usr/share/applications/Amber.desktop"
